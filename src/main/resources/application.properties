# JWT CONFIG
# Access Token sống ngắn. app.jwt.expiration dùng milliseconds. 300000 = 5 phút.
app.jwt.secret=12345678901234567890123456789012
app.jwt.expiration=300000

# Refresh Token sống 10 phút theo yêu cầu. 600000 = 10 phút.
app.jwt.refresh-expiration=600000

# COOKIE CONFIG
# Dev local HTTP: secure=false. Production HTTPS: secure=true.
# Production HTTPS có thể đổi tên thành __Host-baixesv_access_token và __Host-baixesv_refresh_token.
app.cookie.access-name=baixesv_access_token
app.cookie.refresh-name=baixesv_refresh_token
app.cookie.secure=false
app.cookie.same-site=Lax

spring.application.name=QuanLiBaiXeSV

spring.datasource.url=jdbc:mysql://localhost:3306/parking_db
spring.datasource.username=root
spring.datasource.password=1111

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
