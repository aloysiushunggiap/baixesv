# JWT CONFIG
app.jwt.secret=12345678901234567890123456789012
app.jwt.expiration=120000


app.jwt.refresh-expiration=180000

# COOKIE CONFIG
# Localhost HTTP: secure=false.
# Production HTTPS: secure=true và có thể đổi tên cookie thành __Host-baixesv_access_token / __Host-baixesv_refresh_token.
app.cookie.access-name=baixesv_access_token
app.cookie.refresh-name=baixesv_refresh_token
app.cookie.secure=false
app.cookie.same-site=Lax

