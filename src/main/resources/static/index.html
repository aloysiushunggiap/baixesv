<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản lý bãi xe sinh viên</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="toast" class="toast hidden"></div>

  <section id="loginView" class="login-view"></section>

  <section id="appView" class="app-view hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">P</div>
        <div>
          <h2>Bãi xe SV</h2>
          <p id="sidebarRole">ROLE</p>
        </div>
      </div>

      <nav class="nav-menu">
        <button class="nav-item active" data-panel="dashboardPanel">Tổng quan</button>
        <button class="nav-item" data-panel="swipePanel">Quẹt thẻ test</button>
        <button class="nav-item" data-panel="pricingPanel">Bảng giá</button>
        <button class="nav-item admin-only" data-panel="simulatePanel">Mô phỏng phí</button>
        <button class="nav-item" data-panel="historyPanel">Lịch sử</button>
        <button class="nav-item admin-only" data-panel="studentPanel">Tài khoản / thẻ</button>
        <button class="nav-item admin-only" data-panel="requestsPanel">Yêu cầu</button>
        <button class="nav-item" data-panel="accountPanel">Đổi mật khẩu</button>
      </nav>

      <button id="logoutButton" type="button" class="btn btn-outline full-width">Đăng xuất</button>
    </aside>

    <main class="content">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">Tổng quan</h1>
          <p id="welcomeText">Xin chào</p>
        </div>
        <div class="user-pill">
          <span id="currentUsername"></span>
          <strong id="currentRole"></strong>
        </div>
      </header>

      <div id="panelHost"></div>
    </main>
  </section>

  <script src="/js/config.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/swipe.js"></script>
  <script src="/js/pricing.js"></script>
  <script src="/js/simulate.js"></script>
  <script src="/js/history.js"></script>
  <script src="/js/students.js"></script>
  <script src="/js/sessions.js"></script>
  <script src="/js/account.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
