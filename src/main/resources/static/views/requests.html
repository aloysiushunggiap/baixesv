<!-- Giao diện yêu cầu quên mật khẩu: chỉ dành cho Admin. -->
<section id="requestsPanel" class="panel active-panel admin-only">
    <div class="card">
        <div class="section-header">
            <div>
                <h2>Yêu cầu quên mật khẩu</h2>
                <p>Admin kiểm tra thông tin sinh viên rồi chọn Đồng ý hoặc Từ chối. Chỉ khi Đồng ý thì mật khẩu mới được cập nhật.</p>
            </div>

            <button id="loadPasswordRequestsButton" type="button" class="btn btn-primary">Tải yêu cầu</button>
        </div>

        <div class="form-group">
            <label for="passwordRequestStatusFilter">Trạng thái</label>
            <select id="passwordRequestStatusFilter">
                <option value="PENDING">Đang chờ duyệt</option>
                <option value="APPROVED">Đã đồng ý</option>
                <option value="REJECTED">Đã từ chối</option>
                <option value="ALL">Tất cả</option>
            </select>
        </div>

        <p id="passwordRequestsMessage" class="message"></p>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Mã sinh viên</th>
                    <th>Họ tên</th>
                    <th>Biển số xe</th>
                    <th>Username</th>
                    <th>Trạng thái</th>
                    <th>Thời gian gửi</th>
                    <th>Người xử lý</th>
                    <th>Thời gian xử lý</th>
                    <th>Lý do từ chối</th>
                    <th>Thao tác</th>
                </tr>
                </thead>

                <tbody id="passwordRequestsBody">
                <tr>
                    <td colspan="11" class="empty-row">Bấm “Tải yêu cầu” để xem danh sách.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
