<section id="sessionsPanel" class="panel active-panel admin-only">
  <div class="card">
    <div class="section-header">
      <div>
        <h2>Phiên đăng nhập còn hạn</h2>
        <p>Danh sách này hiển thị các phiên còn Refresh Token hợp lệ. Access Token có thể được cấp mới khi Refresh Token còn hạn.</p>
      </div>
      <button id="loadSessionsButton" type="button" class="btn btn-primary">Tải phiên</button>
    </div>

    <p id="sessionsMessage" class="message"></p>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Session ID</th>
            <th>Username</th>
            <th>Role</th>
            <th>Card ID</th>
            <th>Thời gian đăng nhập</th>
            <th>Access hết hạn</th>
            <th>Refresh hết hạn</th>
            <th>Thao tác</th>
          </tr>
        </thead>
        <tbody id="sessionsBody">
          <tr><td colspan="8" class="empty-row">Bấm “Tải phiên” để xem danh sách.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
