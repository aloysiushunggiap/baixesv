<!-- Giao diện quản lý sinh viên/thẻ và tài khoản admin: chỉ dành cho Admin. -->
<section id="studentPanel" class="panel active-panel admin-only">
  <div class="grid two-columns">
    <!-- Khối đăng ký sinh viên mới. Backend tự sinh cardId. -->
    <div class="card">
      <h2>Đăng ký sinh viên</h2>
      <p class="section-note">Đăng kí mới tài khoản và tạo thẻ.</p>

      <div class="form-stack">
        <div class="form-group">
          <label for="studentId">Mã sinh viên</label>
          <input id="studentId" type="text" maxlength="8" placeholder="8 chữ số" />
        </div>

        <div class="form-group">
          <label for="studentName">Họ tên</label>
          <input id="studentName" type="text" placeholder="Nguyễn Văn A" />
        </div>

        <div class="form-group">
          <label for="studentLicensePlate">Biển số xe</label>
          <input id="studentLicensePlate" type="text" placeholder="59A1-12345" />
        </div>

        <div class="form-group">
          <label for="studentUsername">Username</label>
          <input id="studentUsername" type="text" placeholder="username sinh viên" />
        </div>

        <div class="form-group">
          <label for="studentPassword">Password</label>
          <input id="studentPassword" type="password" placeholder="Mật khẩu" />
        </div>

        <button id="registerStudentButton" type="button" class="btn btn-success">Đăng ký sinh viên</button>
        <p id="studentMessage" class="message"></p>
      </div>
    </div>

    <!-- Khối xóa thẻ sinh viên. -->
    <div class="card">
      <h2>Xóa thẻ sinh viên</h2>
      <p class="section-note">Chỉ xóa được khi xe không còn trong bãi.</p>

      <div class="form-group">
        <label for="deleteCardId">Card ID cần xóa</label>
        <input id="deleteCardId" type="text" placeholder="Ví dụ: CARD-AB12CD34" />
      </div>

      <button id="deleteCardButton" type="button" class="btn btn-danger">Xóa thẻ</button>
      <p id="deleteCardMessage" class="message"></p>

      <!-- Hiển thị thông tin sinh viên vừa đăng ký. -->
      <div id="newStudentResult" class="result-box hidden"></div>
    </div>

    <!-- Khối đăng ký tài khoản admin mới. -->
    <div class="card">
      <h2>Đăng ký admin</h2>
      <p class="section-note">Chỉ admin đang đăng nhập mới được tạo thêm tài khoản admin.</p>

      <div class="form-stack">
        <div class="form-group">
          <label for="adminUsername">Username admin</label>
          <input id="adminUsername" type="text" placeholder="username admin mới" />
        </div>

        <div class="form-group">
          <label for="adminPassword">Password</label>
          <input id="adminPassword" type="password" placeholder="Mật khẩu admin mới" />
        </div>

        <div class="form-group">
          <label for="adminPasswordConfirm">Nhập lại password</label>
          <input id="adminPasswordConfirm" type="password" placeholder="Nhập lại mật khẩu" />
        </div>

        <button id="registerAdminButton" type="button" class="btn btn-success">Đăng ký admin</button>
        <p id="adminRegisterMessage" class="message"></p>
        <div id="newAdminResult" class="result-box hidden"></div>
      </div>
    </div>

    <!-- Khối xóa tài khoản admin. -->
    <div class="card">
      <h2>Xóa tài khoản admin</h2>
      <p class="section-note">Không cho phép tự xóa tài khoản admin đang đăng nhập hoặc xóa admin cuối cùng.</p>

      <div class="form-group">
        <label for="deleteAdminUsername">Username admin cần xóa</label>
        <input id="deleteAdminUsername" type="text" placeholder="username admin cần xóa" />
      </div>

      <button id="deleteAdminButton" type="button" class="btn btn-danger">Xóa admin</button>
      <p id="deleteAdminMessage" class="message"></p>
    </div>
  </div>
</section>
